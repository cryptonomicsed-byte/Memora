[package]
name = "immutex-sentinel"
version = "0.1.0"
edition = "2021"
description = "Static drainer/supply-chain scanner run by staked Immutex Sentinel agents before a site build may go live"
license = "Apache-2.0"

[lib]
name = "immutex_sentinel"
path = "src/lib.rs"

[[bin]]
name = "immutex-sentinel"
path = "src/main.rs"

# Deliberately zero dependencies: the core is pure (no IO) so it compiles to
# wasm32-wasip1 and can run inside a Wasm sandbox on untrusted reviewer nodes.
[dependencies]
